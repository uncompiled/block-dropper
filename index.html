<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Block Dropper</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#1a1a2e" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <script id="gsi-script" async src="https://accounts.google.com/gsi/client"></script>
</head>

<body>
  <div id="app">
    <div class="game-wrapper glass-panel">
      <div class="main-content">
        <div class="board-container">
          <canvas id="game-canvas" width="200" height="400"></canvas>
          <div id="game-over-screen" class="overlay hidden">
            <h2>GAME OVER</h2>
            <p>Final Score: <span id="final-score">0</span></p>
            <button id="restart-btn" class="glass-button primary">PLAY AGAIN</button>
            <button id="save-score-btn" class="glass-button outline hidden">SAVE SCORE</button>
            <p id="save-score-msg" class="save-msg hidden"></p>
          </div>
          <div id="pause-screen" class="overlay hidden">
            <h2>PAUSED</h2>
          </div>
        </div>

        <div class="side-panel">
          <div class="stats-box">
            <div class="stat-label">SCORE</div>
            <div id="score" class="stat-value">0</div>
          </div>

          <div class="stats-box">
            <div class="stat-label">LEVEL</div>
            <div id="level" class="stat-value">1</div>
          </div>

          <div class="stats-box">
            <div class="stat-label">NEXT</div>
            <div class="next-canvas-wrapper">
              <canvas id="next-canvas" width="120" height="120"></canvas>
            </div>
          </div>

          <button id="start-btn" class="glass-button primary">START GAME</button>

          <div class="controls-hint">
            <p><span>← →</span> Move</p>
            <p><span>↑</span> Rotate</p>
            <p><span>↓</span> Drop</p>
            <p><span>Space</span> Hard Drop</p>
            <p><span>P</span> Pause</p>
          </div>
        </div>
      </div>

      <div class="mobile-controls">
        <div class="control-row d-pad">
          <button id="btn-left" class="glass-button control-btn"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 10 10" fill="currentColor" aria-hidden="true"><polygon points="8,1 2,5 8,9"/></svg></button>
          <button id="btn-down" class="glass-button control-btn"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 10 10" fill="currentColor" aria-hidden="true"><polygon points="1,2 9,2 5,9"/></svg></button>
          <button id="btn-right" class="glass-button control-btn"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 10 10" fill="currentColor" aria-hidden="true"><polygon points="2,1 8,5 2,9"/></svg></button>
        </div>
        <div class="control-row action-pad">
          <button id="btn-rotate" class="glass-button control-btn action-btn"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/><path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/></svg></button>
          <button id="btn-drop" class="glass-button control-btn action-btn">DROP</button>
        </div>
      </div>
    </div>

    <section id="scoreboard" class="scoreboard glass-panel">
      <h3 class="scoreboard-title">HIGH SCORES</h3>
      <button id="logout-btn" class="glass-button primary hidden"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M10 3.5a.5.5 0 0 0-.5-.5h-8a.5.5 0 0 0-.5.5v9a.5.5 0 0 0 .5.5h8a.5.5 0 0 0 .5-.5v-2a.5.5 0 0 1 1 0v2A1.5 1.5 0 0 1 9.5 14h-8A1.5 1.5 0 0 1 0 12.5v-9A1.5 1.5 0 0 1 1.5 2h8A1.5 1.5 0 0 1 11 3.5v2a.5.5 0 0 1-1 0v-2z"/><path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3z"/></svg></button>
      <table class="scoreboard-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Player</th>
            <th>Score</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="scoreboard-list"></tbody>
      </table>
    </section>
  </div>
  <script type="module" src="/src/main.ts"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>

</html>
